<div class="min-h-screen bg-gray-900 text-gray-200">
  <header class="bg-gray-800/50 backdrop-blur-sm border-b border-gray-700 sticky top-0 z-10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Left side: Title and Status -->
        <div class="flex items-center space-x-4">
          <h1 class="text-xl font-bold text-indigo-400">Adaptive Narrative Engine</h1>
          <div class="px-2 py-0.5 rounded-full text-xs font-semibold" [class]="statusInfo().class">
            {{ statusInfo().text }}
          </div>
        </div>

        <!-- Center: Tabs -->
        <div class="hidden md:block">
          <nav class="flex items-baseline space-x-4">
            <button
              (click)="uiService.setActiveTab('CREATION')"
              [class.bg-gray-900]="activeTab() === 'CREATION'"
              [class.border-indigo-500]="activeTab() === 'CREATION'"
              [class.text-white]="activeTab() === 'CREATION'"
              class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 border-b-2 border-transparent transition-colors">
              CREATION
            </button>
            <button
              (click)="uiService.setActiveTab('GAME')"
              [disabled]="!hasCharacter()"
              [class.bg-gray-900]="activeTab() === 'GAME'"
              [class.border-indigo-500]="activeTab() === 'GAME'"
              [class.text-white]="activeTab() === 'GAME'"
              class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 disabled:text-gray-600 disabled:cursor-not-allowed border-b-2 border-transparent transition-colors">
              GAME
            </button>
            <button
              (click)="uiService.setActiveTab('SHEET')"
              [disabled]="!hasCharacter()"
              [class.bg-gray-900]="activeTab() === 'SHEET'"
              [class.border-indigo-500]="activeTab() === 'SHEET'"
              [class.text-white]="activeTab() === 'SHEET'"
              class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 disabled:text-gray-600 disabled:cursor-not-allowed border-b-2 border-transparent transition-colors">
              SHEET
            </button>
          </nav>
        </div>

        <!-- Right side: Reset Button -->
        <div>
          @if(hasCharacter()) {
            <button (click)="resetGame()" class="px-3 py-2 rounded-md text-sm font-medium text-red-400 hover:bg-red-900/50 transition-colors">
              Reset
            </button>
          }
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto p-4 md:p-6 lg:p-8">
    @switch (activeTab()) {
      @case ('CREATION') {
        <app-creation />
      }
      @case ('GAME') {
        @if(hasCharacter()) {
           <app-game />
        }
      }
      @case ('SHEET') {
        @if(hasCharacter()) {
           <app-sheet />
        }
      }
    }
  </main>

  <!-- Mobile Tab Bar -->
  <footer class="md:hidden fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 flex justify-around p-2">
      <button
        (click)="uiService.setActiveTab('CREATION')"
        [class.text-indigo-400]="activeTab() === 'CREATION'"
        class="flex flex-col items-center text-xs text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
        <span>Creation</span>
      </button>
      <button
        (click)="uiService.setActiveTab('GAME')"
        [disabled]="!hasCharacter()"
        [class.text-indigo-400]="activeTab() === 'GAME'"
        class="flex flex-col items-center text-xs text-gray-400 disabled:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
        <span>Game</span>
      </button>
      <button
        (click)="uiService.setActiveTab('SHEET')"
        [disabled]="!hasCharacter()"
        [class.text-indigo-400]="activeTab() === 'SHEET'"
        class="flex flex-col items-center text-xs text-gray-400 disabled:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
        <span>Sheet</span>
      </button>
  </footer>

</div>
